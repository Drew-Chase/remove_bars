[package]
name = "remove_bars"
version = "0.2.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
colored = "3"
console = "0.16.4"
ffmpeg-sidecar = { version = "2.5", default-features = false }
indicatif = "0.18.6"
rayon = "1.12.0"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2"


[profile.release]
lto=true
codegen-units = 1
panic = "abort"
opt-level = "s"
