[package]
name = "remove_bars"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
colored = "3"
ffmpeg-sidecar = { version = "2.5", default-features = false }
indicatif = "0.18.6"
regex = "1"
walkdir = "2"


[profile.release]
lto=true
codegen-units = 1
panic = "abort"
opt-level = "s"
